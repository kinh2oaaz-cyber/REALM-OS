[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realm-os"
version = "1.0.0"
description = "REALM OS — a premium, interconnected personal desktop application ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "REALM" }]
dependencies = [
    "PySide6>=6.7",
    "psutil>=5.9",
    "cryptography>=42",
]

[project.scripts]
realmos = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*", "core*", "database*", "modules*", "system*", "ui*", "integrations*", "security*"]

[tool.setuptools.package-data]
"*" = ["*.qss", "*.svg", "*.png", "*.ico"]
