name: tests

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Windows · Python
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate imports / bytecode
        run: python -m compileall -q app core database modules system ui security main.py

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          REALMOS_DATA_DIR: ${{ runner.temp }}/realmos-test
        run: python -m unittest discover -s tests -t . -v
